# Build the stand-alone SWAT+ executable and the shared library (libswatplus_api) of the mf6swatp branch:
#   Linux   gfortran 16
#   macOS   gfortran 15
#   Windows gfortran 15 (gfortran 16 is an experiment: its Windows build crashed on 2026-11-20)
#   Windows ifx (Intel oneAPI)
# Each job runs quick checks and keeps its files as a workflow artifact.
# mf6swatp-release.yml calls this workflow (workflow_call) and puts the artifacts into a draft release.

name: Build mf6swatp

on:
  push:
    branches: [mf6swatp-api-62.0.1]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/swat-model/swatplus.git

jobs:
  linux-gnu:
    name: Linux, gfortran ${{ matrix.gcc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [16]
    steps:
      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ matrix.gcc }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get the official release tags
        # the fork has no tags of its own; CMake takes the version name from `git describe --tags`
        run: git fetch --tags --force $UPSTREAM

      - name: Versions
        run: |
          echo "FC=$FC"
          $FC --version | head -n 1 | tee versions.txt
          cmake --version | head -n 1 | tee -a versions.txt
          echo "source: $(git rev-parse HEAD)" | tee -a versions.txt
          echo "describe: $(git describe --tags --always)" | tee -a versions.txt

      - name: Build (executable and library)
        run: |
          TAG=$(git describe --tags 2>/dev/null || echo "mf6swatp-${GITHUB_SHA::7}")
          echo "version name: $TAG"
          cmake -S . -B build/Release -D CMAKE_BUILD_TYPE=Release -D CMAKE_Fortran_COMPILER=$FC -D TAG=$TAG
          cmake --build build/Release --parallel 4
          ls -l build/Release | grep -E "swatplus|\.so"

      - name: Check the library is self-contained and loads
        run: |
          lib=build/Release/libswatplus_api.so
          echo "undefined symbols the library needs from outside:"
          nm -D --undefined-only $lib | awk '{print $2}' | sed 's/@.*//' | sort -u
          ldd $lib
          python3 -c "import ctypes; ctypes.CDLL('$lib'); print('library loads')"

      - name: Run the executable on the Ames_sub1 test model
        run: |
          exe=$(ls build/Release/swatplus-*-Rel | head -n 1)
          rm -rf ames_run
          cp -r refdata/Ames_sub1 ames_run
          cp "$exe" ames_run/swatplus.exe
          cd ames_run
          ./swatplus.exe > run.log 2>&1 || { tail -n 30 run.log; exit 1; }
          tail -n 3 run.log
          grep -q "Execution successfully completed" run.log

      - name: Collect files
        run: |
          mkdir -p out
          cp build/Release/libswatplus_api.so build/Release/swatplus-*-Rel versions.txt LICENSE out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mf6swatp-linux-gnu${{ matrix.gcc }}
          path: out/

  macos-gnu:
    name: macOS, gfortran ${{ matrix.gcc }}
    runs-on: macos-latest
    # new job (2026-11-20): do not let it fail the workflow until it has run once
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        gcc: [15]
    steps:
      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ matrix.gcc }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get the official release tags
        run: git fetch --tags --force $UPSTREAM

      - name: Versions
        run: |
          echo "FC=$FC"
          $FC --version | head -n 1 | tee versions.txt
          cmake --version | head -n 1 | tee -a versions.txt
          uname -m | tee -a versions.txt
          echo "source: $(git rev-parse HEAD)" | tee -a versions.txt
          echo "describe: $(git describe --tags --always)" | tee -a versions.txt

      - name: Build (executable and library)
        run: |
          TAG=$(git describe --tags 2>/dev/null || echo "mf6swatp-${GITHUB_SHA::7}")
          echo "version name: $TAG"
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_Fortran_COMPILER=$FC -D TAG=$TAG
          cmake --build build --parallel 4
          ls -l build | grep -E "swatplus|dylib"

      - name: Check the library (what it needs, loads, exports)
        run: |
          lib=$(ls build/libswatplus_api.dylib)
          otool -L $lib
          python3 .github/scripts/check_dll.py $lib

      - name: Run the executable on the Ames_sub1 test model
        run: |
          exe=$(ls build/swatplus-*-Rel | head -n 1)
          rm -rf ames_run
          cp -r refdata/Ames_sub1 ames_run
          cp "$exe" ames_run/swatplus.exe
          cd ames_run
          ./swatplus.exe > run.log 2>&1 || { tail -n 30 run.log; exit 1; }
          tail -n 3 run.log
          grep -q "Execution successfully completed" run.log

      - name: Collect files
        run: |
          mkdir -p out
          cp build/libswatplus_api.dylib build/swatplus-*-Rel versions.txt LICENSE out/
          otool -L out/swatplus-*-Rel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mf6swatp-macos-gnu${{ matrix.gcc }}
          path: out/

  windows-gnu:
    name: Windows, gfortran ${{ matrix.gcc }}
    runs-on: windows-latest
    # gfortran 16.2.0 for Windows crashed (internal compiler error) on 2026-11-20; 15 is the fallback.
    continue-on-error: ${{ matrix.gcc == 16 }}
    strategy:
      fail-fast: false
      matrix:
        # gfortran 16 for Windows is left out: it crashes every time (internal compiler error, 2026-11-20 and 2026-11-23); add 16 to try it again
        gcc: [15]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ matrix.gcc }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get the official release tags
        run: git fetch --tags --force $UPSTREAM

      - name: Versions
        run: |
          echo "FC=$FC"
          $FC --version | head -n 1 | tee versions.txt
          cmake --version | head -n 1 | tee -a versions.txt
          echo "source: $(git rev-parse HEAD)" | tee -a versions.txt
          echo "describe: $(git describe --tags --always)" | tee -a versions.txt

      - name: Build (executable and library)
        run: |
          TAG=$(git describe --tags 2>/dev/null || echo "mf6swatp-${GITHUB_SHA::7}")
          echo "version name: $TAG"
          cmake -B build -G "MinGW Makefiles" -D CMAKE_Fortran_COMPILER=$FC -D TAG=$TAG -D CMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          ls -l build | grep -E "swatplus|\.dll"

      - name: List the DLLs the library and the executable need
        run: |
          for f in build/*swatplus_api*.dll build/swatplus-*.exe; do echo "== $f"; objdump -p "$f" | grep "DLL Name" || true; done

      - name: Run the executable on the Ames_sub1 test model
        run: |
          exe=$(ls build/swatplus-*.exe | head -n 1)
          rm -rf ames_run
          cp -r refdata/Ames_sub1 ames_run
          cp "$exe" ames_run/swatplus.exe
          cd ames_run
          ./swatplus.exe > run.log 2>&1 || { tail -n 30 run.log; exit 1; }
          tail -n 3 run.log
          grep -q "Execution successfully completed" run.log

      - name: Collect files and check the packaged library
        run: |
          mkdir -p out
          cp build/*swatplus_api*.dll build/swatplus-*.exe versions.txt LICENSE out/
          # MinGW runtime DLLs that the files still need (libwinpthread-1.dll), copied from the compiler folder
          bindir=$(dirname "$(which gfortran)")
          for dep in $(objdump -p out/*.dll out/*.exe | grep "DLL Name" | awk '{print $3}' | tr -d '\r' | sort -u); do
            if [ -f "$bindir/$dep" ]; then cp "$bindir/$dep" out/ && echo "runtime DLL packaged: $dep"; fi
          done
          ls -l out
          python .github/scripts/check_dll.py out/$(ls out | grep -i swatplus_api | grep -i "\.dll$" | head -n 1)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mf6swatp-windows-gnu${{ matrix.gcc }}
          path: out/

  windows-ifx:
    name: Windows, ifx (${{ matrix.generator }})
    runs-on: windows-latest
    # the ifx build is still being brought up: do not let it fail the workflow
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        generator: ['Ninja']
    defaults:
      run:
        shell: bash
    steps:
      - name: Use CMake 3.31
        # CMake 4.5 on the runner stops on ifx with "required internal CMake variable not set: CMAKE_Fortran_PREPROCESS_SOURCE"
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - name: Install compiler
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.2'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get the official release tags
        run: git fetch --tags --force $UPSTREAM

      - name: Versions
        run: |
          echo "FC=$FC"
          ($FC --version 2>&1 | head -n 1) | tee versions.txt
          cmake --version | head -n 1 | tee -a versions.txt
          echo "source: $(git rev-parse HEAD)" | tee -a versions.txt
          echo "describe: $(git describe --tags --always)" | tee -a versions.txt

      - name: Version name
        run: |
          TAG=$(git describe --tags 2>/dev/null || echo "mf6swatp-${GITHUB_SHA::7}")
          echo "version name: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Set up the Microsoft build environment
        # ifx needs link.exe from Visual Studio ("ifx: error #10037: could not find 'link'" without it)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (executable and library)
        # cmd, not Git Bash: Git's own link.exe would shadow the Microsoft linker that ifx needs
        shell: cmd
        run: |
          cmake -B build -G "${{ matrix.generator }}" -D CMAKE_Fortran_COMPILER=ifx -D TAG=%TAG% -D CMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build build --parallel 4
          if errorlevel 1 exit /b 1
          dir build\swatplus-*.exe build\*swatplus_api*

      - name: Check the library (DLLs it needs, exports, loads)
        run: |
          echo "DLLs the library needs:"
          dumpbin //dependents build/swatplus_api.dll | grep -i "\.dll" || true
          EXTRA_DLL_DIRS="$(cygpath -w "$CMPLR_ROOT/bin")" python .github/scripts/check_dll.py

      - name: Show the CMake log if the build failed
        if: failure()
        run: |
          ls build/CMakeFiles | head -n 20
          for f in build/CMakeFiles/CMakeConfigureLog.yaml build/CMakeFiles/CMakeError.log; do
            [ -f "$f" ] && { echo "=== $f"; head -n 150 "$f" | cut -c1-220; }
          done

      - name: Run the executable on the Ames_sub1 test model
        run: |
          exe=$(ls build/swatplus-*.exe | head -n 1)
          rm -rf ames_run
          cp -r refdata/Ames_sub1 ames_run
          cp "$exe" ames_run/swatplus.exe
          cd ames_run
          ./swatplus.exe > run.log 2>&1 || { tail -n 30 run.log; exit 1; }
          tail -n 3 run.log
          grep -q "Execution successfully completed" run.log

      - name: Collect files (with the Intel runtime DLLs) and check the packaged library
        run: |
          mkdir -p out
          cp build/swatplus_api.dll build/swatplus-*.exe versions.txt LICENSE out/
          # the Intel runtime DLLs the executable and the library need (Intel allows redistributing them)
          for f in build/swatplus-*.exe build/swatplus_api.dll; do dumpbin //dependents $f; done | tr -d '\r' | grep -iE "^\s+\S+\.dll$" | tr -d ' ' | sort -u > deps.txt
          cat deps.txt
          root=$(cygpath -u "$CMPLR_ROOT")
          for d in $(cat deps.txt); do
            if [ -f "$root/bin/$d" ]; then cp "$root/bin/$d" out/ && echo "runtime DLL packaged: $d"; fi
          done
          ls -l out
          python .github/scripts/check_dll.py out/swatplus_api.dll

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mf6swatp-windows-ifx-${{ matrix.generator == 'Ninja' && 'ninja' || 'nmake' }}
          path: out/
